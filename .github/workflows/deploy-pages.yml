name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir src/frontend build

      - name: Prepare SPA fallback
        run: cp src/frontend/dist/index.html src/frontend/dist/404.html

      - name: Publish build to Pages root
        run: |
          rm -rf assets favicon.ico index.html 404.html env.json
          cp -R src/frontend/dist/. ./
          git restore src/frontend/dist

      - name: Commit and push published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets favicon.ico index.html 404.html env.json
          if git diff --cached --quiet; then
            echo "No published site changes to commit."
          else
            git commit -m "Deploy frontend to GitHub Pages [skip ci]"
            git push
          fi
